; GT3R Concept Coupe: the example mod car (README.md next to cars/ explains how to
; install, try and tune it). Every line says why its value is what it is, so you can
; copy this file, rename the label and work through it top to bottom.
;
; Format: docs/MODDING.md "Adding cars". Anything this file leaves out is borrowed
; from the donor car on the player's own disc.

[car]
label = gt3r_concept_coupe_24  ; unique id (a-z, 0-9, _). Garage, saves and replays use it: never change it once shared
name = Concept Coupe           ; shown after the maker's name
maker = GT3R                   ; no disc dealer sells GT3R cars, so makers/gt3r.ini adds one
year = 2024                    ; the year the body was modeled
price = 52000                  ; credits: between the disc's ~280 PS coupes (Supra RZ 44,800) and a CLK55 (93,110)
category = production          ; a road car (race cars use other bodies and rules)
donor = z_detroitver_01        ; Nissan Z Concept: also a front-engined V6 rear-drive concept coupe of
                               ; similar size (4300 mm, 1320 kg). The donor lends suspension geometry,
                               ; steering, tire compounds, brakes, aids and the shop's upgrade parts.

[body]
; Measured from models/concept_coupe.glb (README.md: "Measuring the model").
weight_kg = 1420               ; curb weight: aluminum 2+2 with a V6 (the game adds 120 kg of driver)
front_weight_pct = 52          ; engine behind the front axle, gearbox at the back
length_mm = 4357
width_mm = 2236                ; without the mirrors; a concept car's stance: very wide
height_mm = 1149
wheelbase_mm = 2799            ; between the wheel centers of the model
front_track_mm = 1952          ; center to center of the modeled tires
rear_track_mm = 1964
cd = 0.29                      ; smooth fastback; real GT coupes measure 0.29-0.34
frontal_area_m2 = 2.06         ; about 0.80 x width x height (fitted with the cd to the [reference] top speed)
; ride_height_mm is left to the donor: the body below is drawn on its own ground line.

[powertrain]
type = engine
; A 3.0-liter naturally aspirated V6 with a high-revving top end. Torque (N*m) at
; the crank; peak power = torque x rpm / 9549: 309 x 7000 / 9549 = 226 kW (307 PS).
curve = 1000:205 2000:250 3000:282 4000:304 4800:316 5400:318 6000:315 6600:312 7000:309 7400:290 7800:262
max_rpm = 7600                 ; rev limiter
idle_rpm = 850
output_pct = 118               ; GT3's hidden output factor (disc cars: mostly 100-120, the R34 GT-R 118),
                               ; fitted with `gt3tool modcar` to the [reference] 0-60 and quarter mile
layout = V6 DOHC
aspiration = NA
displacement = 2996cc
; sound_id is left to the donor: its 3.5-liter V6 sound bank suits this engine.

[drivetrain]
drive = FR                     ; front engine, rear-wheel drive
gears = 3.55 2.20 1.58 1.24 1.00 0.80  ; 6-speed manual: close lower gears, an overdrive sixth
final_drive = 3.91             ; fifth reaches the limiter at 280 km/h, just past where drag tops the car out
reverse = 3.40

[tires]
; The modeled tires are 768 mm across on 22-inch rims. Staggered sizes that match
; that diameter (rim 22 x 25.4 + 2 x width x aspect): 265/40R22 = 771 mm, 295/35R22 = 765 mm.
front = 265/40R22
rear = 295/35R22
grip_pct = 88                  ; fitted to the [reference] skidpad: at 100 % the donor's street tires on
                               ; this wide car would hold 1.09 g, far more than a road car's 0.94

[model]
file = models/concept_coupe.glb ; our own body (wheels come from the engine: see below)
wheel = enw010_b               ; a dark multi-spoke rim from the disc (browse them with gt3r --browse wheel/)
lower_mm = 0                   ; fine-tune the body's height over the wheels if the arches look off

[paints]                       ; the dealer's color picker, in order; the roof and sills stay black
Carmine Red = #9B1B24
Pearl White = #E7E5DF
Glacier Silver = #B8BCC0
Graphite Gray = #3B3E43
Midnight Blue = #1D2A4B
Solar Yellow = #E2B01C

[dealer]
for_sale = yes                 ; at the GT3R dealer (Europe > Germany), for [car] price
description = The Concept Coupe is GT3 Revisited's example car: a front-engined 2+2 with a 3.0-liter V6 that revs to 7,600 rpm, a six-speed manual and rear-wheel drive on 22-inch wheels. Its body, its numbers and its pictures are all part of the example mod, so you can see how a car is made, then build your own.
picture = images/concept_coupe.png       ; 640x448, rendered with the game's car viewer (README.md "Pictures")
thumb = images/concept_coupe_thumb.png   ; 51x27: the dealer's strip button and the arcade picker's icon
; logo is left out: the dealer writes the name in the menu font instead

[arcade]
class = auto                   ; ranked by power-to-weight like the game's own cars
level = 0                      ; available from the start

[reference]
; Targets for a ~300 PS, 1,420 kg rear-drive coupe on summer tires (magazine tests of
; cars like it: 0-60 mph 4.9-5.3 s, quarter mile 13.3-13.7 s, 0.92-0.96 g).
; Only `gt3tool modcar` reads these: it prints its own results next to them.
zero_to_60_s = 5.1
quarter_mile_s = 13.5
top_speed_kmh = 270
skidpad_g = 0.94
