# The relay's own journal (gt3r-relay.service has LogNamespace=gt3r-relay): its logs rotate at
# their own cap and never push the system's logs out. deploy.sh installs it as
# /etc/systemd/journald@gt3r-relay.conf. Read the relay's logs with
#   journalctl --namespace=gt3r-relay
# After editing: systemctl restart systemd-journald@gt3r-relay (then restart gt3r-relay).
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=1G
